experiment_name: hierarchical_bottom_up_v2_seed42
model: hierarchical
tensor_dir: ../../data/tensors
vocab_path: ../artifacts/vocab/vocab.json
checkpoint_dir: ../artifacts/checkpoints
results_dir: ../artifacts/results
kernel_types:
  - 2layer
  - 3layer
  - conv1d
  - conv2d
  - dense_latency
  - dense_resource
  - rule4ml
seed: 42
split_strategy: official_or_stratified
family_balanced_sampling: false
batch_size: 8
num_workers: 0
pin_memory: true
prefetch_factor: 2
thread_prefetch: true
precision: bf16
epochs: 400
patience: 30
learning_rate: 0.001
weight_decay: 0.0001
hidden_dim: 64
num_layers: 3
dropout: 0.15
use_global_features: true
use_context: true
context_mode: core
split_heads: true
hurdle_heads: true
hurdle_prediction_mode: threshold
loss: log_huber_hurdle
log_huber_delta: 0.35
hurdle_classification_weight: 0.25
early_stopping_metric: smape
verbose: 2
