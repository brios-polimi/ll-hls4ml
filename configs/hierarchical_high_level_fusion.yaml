experiment_name: hierarchical_high_level_fusion_scale100_seed42
model: hierarchical_high_level_fusion
tensor_dir: ../../data/tensors
vocab_path: ../artifacts/vocab/vocab.json
high_level_cache: ../artifacts/cache/wa_high_level_scale100.pt
split_manifest_path: ../artifacts/results/ll_hls4ml_gatv2_scaling_results/kaggle_v2_gatv2_1head_scale100_seed42/split_manifest.json
require_complete_split_manifest: true
checkpoint_dir: ../artifacts/checkpoints
results_dir: ../artifacts/results
kernel_types:
  - 2layer
  - 3layer
  - conv1d
  - conv2d
  - dense_latency
  - dense_resource
  - rule4ml
seed: 42
family_balanced_sampling: false
batch_size: 8
num_workers: 2
worker_tmpdir: /tmp
pin_memory: true
prefetch_factor: 2
thread_prefetch: false
precision: bf16
epochs: 400
patience: 30
learning_rate: 0.001
weight_decay: 0.0001
hidden_dim: 64
num_layers: 3
heads: 1
dropout: 0.15
high_level_encoder: gatv2
use_global_features: true
use_context: true
context_mode: core
split_heads: true
hurdle_heads: true
hurdle_prediction_mode: threshold
loss: log_huber_hurdle
log_huber_delta: 0.35
hurdle_classification_weight: 0.25
early_stopping_metric: smape
verbose: 2
