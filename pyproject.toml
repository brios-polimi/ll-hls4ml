[project]
name = "hls-surrogate-lab"
version = "0.1.0"
description = "Backend-aware surrogate experiments for HLS resource and timing prediction"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "torch",
    "torch-geometric",
    "numpy",
    "tqdm",
    "pyyaml",
]

[project.optional-dependencies]
analysis = [
    "pandas",
    "networkx",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "scipy",
]
notebooks = [
    "ipython",
    "jupyter",
    "ipywidgets",
    "ipympl",
    "pandas",
    "networkx",
    "scikit-learn",
    "matplotlib",
    "seaborn",
    "scipy",
]
dev = []

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
